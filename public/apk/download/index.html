<!doctype html>
<!--
  STANDALONE PAGE — intentionally NOT part of the React app.

  This is a plain static HTML file, not a route inside src/App.jsx's
  router. Vite copies everything under public/ to dist/ untouched, so this
  file ships as dist/download/index.html and is served directly by the
  host at /apk/download — it never touches the SPA's JS bundle, App.jsx's
  routing/subdomain logic, or the catch-all "/((?!api/).*) -> /index.html"
  rewrite in vercel.json (that rewrite only applies when no real static
  file exists at the requested path — see e.g. /admin.html, which relies
  on the exact same behavior).

  The href below is filled in automatically by
  .github/workflows/build-apk.yml every time it builds a new APK — see the
  "Point the /apk/download page at this repo's raw APK URL" step. Left as the
  %%APK_URL%% placeholder here until the first workflow run.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download Anonroom</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0c0d10;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 380px;
      text-align: center;
      background: #16171c;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 36px 28px;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      margin: 0 auto 20px;
      display: block;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.5; color: rgba(245,245,247,0.6); margin: 0 0 28px; }
    a.download-btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      background: #ff5a3c;
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    a.download-btn:active { opacity: 0.8; }
    .note {
      margin-top: 18px;
      font-size: 12px;
      color: rgba(245,245,247,0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="/android-chrome-512x512.png" alt="Anonroom" />
    <h1>Download Anonroom</h1>
    <p>Get the Android app (.apk). You may need to allow "install from unknown sources" the first time.</p>
    <a class="download-btn" href="%%APK_URL%%" download>Download APK</a>
    <div class="note">Debug build, updated automatically on each release.</div>
  </div>
</body>
</html>

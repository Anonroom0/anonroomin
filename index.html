<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- STRICT VIEWPORT: Disables zoom completely and ensures edge-to-edge fitting -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <title>Anonroom</title>
    
    <style>
      /* Global Mobile App Reset */
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100dvh; /* Dynamic height completely fixes bottom edge cutoff */
        overflow: hidden; /* Stops elastic bounce scrolling on the background */
        touch-action: pan-y; /* Disables double-tap to zoom */
        -webkit-text-size-adjust: none;
        background: #000;
        color: #fff;
      }
      
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        overflow: hidden;
      }

      /* iOS strictly zooms in if input fonts are < 16px. This forces them to 16px globally. */
      input, textarea, select, button {
        font-size: 16px !important;
      }
    </style>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>


  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

name: Build Android APK

on:
  workflow_dispatch: {}

# The commit-the-APK-back-into-the-repo step below needs push access —
# the default GITHUB_TOKEN is read-only unless this is declared.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (not the default shallow clone) so the later
          # `git pull --rebase` before pushing the APK commit doesn't choke
          # on a shallow repo if main has moved since this run started.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Build web app (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install Capacitor CLI + Android platform
        run: npm install @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0

      - name: Init Capacitor config
        run: npx cap init "Anonroom" "in.anonroom.app" --web-dir=dist

      - name: Add Android platform
        run: npx cap add android

      - name: Fix Kotlin stdlib version conflict
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
                  }
              }
          }
          EOF

      - name: Add location permissions
        run: |
          sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml

      - name: Set app icon and splash screen
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          mkdir -p resources
          convert public/android-chrome-512x512.png -resize 1024x1024 resources/icon.png
          convert -size 2732x2732 xc:"#0C0D10" \
            public/android-chrome-512x512.png -gravity center -composite \
            resources/splash.png
          npx @capacitor/assets generate --android

      - name: Sync web build + native plugins into Android project
        # `cap sync` (not just `cap copy`) is required here: @capacitor/share
        # and @capacitor/filesystem (added for the native Share-to-Instagram
        # story flow — see src/lib/storyImageGenerator.js) are native
        # plugins that need to be linked into the Android project's
        # build.gradle/MainActivity, not just have their web JS copied in.
        # `cap copy` alone would leave them unlinked and the native Share
        # calls would fail at runtime even though the web bundle built fine.
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anonroom-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Copy APK into repo for the /download page
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/anonroom-latest.apk

      - name: Point the download pages at this repo's raw APK URL
        # Self-configuring for whatever repo/branch this runs in.
        # Legacy public/download is optional — missing file must NOT fail the job.
        # Canonical page: public/apk/download + public/apk/version.json.
        run: |
          APK_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/downloads/anonroom-latest.apk"
          APP_VERSION=$(node -p "require('./package.json').version")

          if [ -f public/download/index.html ]; then
            sed -i "s#%%APK_URL%%#$APK_URL#g" public/download/index.html || true
          else
            echo "Skipping public/download/index.html (not in repo)"
          fi

          mkdir -p public/apk/download
          if [ -f public/apk/download/index.html ]; then
            sed -i "s#%%APK_URL%%#$APK_URL#g" public/apk/download/index.html || true
            sed -i -E "s#href=\"[^\"]+\"([^>]*download)#href=\"$APK_URL\"\1#g" public/apk/download/index.html || true
          else
            cat > public/apk/download/index.html <<EOF
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download Anonroom</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #0c0d10; color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      width: 100%; max-width: 380px; text-align: center; background: #16171c;
      border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 36px 28px;
    }
    .icon { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 20px; display: block; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.5; color: rgba(245,245,247,0.6); margin: 0 0 28px; }
    a.download-btn {
      display: block; width: 100%; padding: 14px 20px; border-radius: 14px;
      background: #ff5a3c; color: #fff; font-weight: 600; font-size: 15px; text-decoration: none;
    }
    .note { margin-top: 18px; font-size: 12px; color: rgba(245,245,247,0.4); }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="/android-chrome-512x512.png" alt="Anonroom" />
    <h1>Download Anonroom</h1>
    <p>Get the Android app (.apk). You may need to allow "install from unknown sources" the first time.</p>
    <a class="download-btn" href="$APK_URL" download>Download APK</a>
    <div class="note">Debug build, updated automatically on each release.</div>
  </div>
</body>
</html>
EOF
          fi

          mkdir -p public/apk
          printf '%s\n' "{\"version\": \"$APP_VERSION\", \"apkUrl\": \"$APK_URL\"}" > public/apk/version.json

          if git diff --cached --quiet; then
            echo "APK unchanged since the last build — nothing to commit."
          else
            git commit -m "chore: update downloadable APK [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

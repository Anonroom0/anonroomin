name: Build Android APK

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Resolve app version for this build
        run: |
          BASE=$(node -p "require('./package.json').version")
          BUILD_VERSION="\( {BASE}. \){{ github.run_number }}"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "Using BUILD_VERSION=${BUILD_VERSION}"

      - name: Build web app (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ env.BUILD_VERSION }}
          VITE_VERSION_JSON_URL: https://anonroom.in/apk/version.json

      - name: Install Capacitor CLI + Android platform + push plugin
        run: npm install @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0 @capacitor/push-notifications@^6.0.2 @capacitor/app@^6.0.0

      - name: Init Capacitor config
        run: npx cap init "Anonroom" "in.anonroom.app" --web-dir=dist

      - name: Add Android platform
        run: npx cap add android

      - name: Decode google-services.json
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is empty"
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | tr -d '\n\r ' | base64 -d > android/app/google-services.json
          head -c 20 android/app/google-services.json | grep -q '{' || {
            echo "ERROR: decoded google-services.json is not valid JSON"
            exit 1
          }

      - name: Add Google Services Gradle plugin
        run: |
          sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

      - name: Fix Kotlin stdlib version conflict
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
                  }
              }
          }
          EOF

      - name: Add location permissions
        run: |
          sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml

      - name: Add App Links intent filters
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          intent = '''
                  <intent-filter android:autoVerify="true">
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="https" android:host="anonroom.in" />
                      <data android:scheme="https" android:host="www.anonroom.in" />
                  </intent-filter>'''
          if 'android:host="anonroom.in"' not in text:
              text = text.replace("</activity>", intent + "\n        </activity>", 1)
              p.write_text(text)
              print("App Links intent-filter added")
          else:
              print("intent-filter already present")
          PY

      - name: Set app icon and splash screen
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          mkdir -p resources
          SRC=public/android-chrome-512x512.png
          if [ -f public/logo.png ]; then SRC=public/logo.png; fi
          test -f "$SRC" || { echo "No icon source found"; exit 1; }
          convert "$SRC" -resize 1024x1024 -background none -gravity center -extent 1024x1024 resources/icon.png
          convert -size 2732x2732 xc:"#0C0D10" \
            "$SRC" -resize 512x512 -gravity center -composite \
            resources/splash.png
          npx @capacitor/assets generate --android

      - name: Sync web build + native plugins into Android project
        run: npx cap sync android

      # MUST run AFTER cap sync so build.gradle is not overwritten
      - name: Set Android versionCode and versionName
        run: |
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="${BUILD_VERSION}"

          # Force stable applicationId
          sed -i -E 's/applicationId[[:space:]]+"[^"]+"/applicationId "in.anonroom.app"/' android/app/build.gradle

          if grep -q "versionCode" android/app/build.gradle; then
            sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
            sed -i -E "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          else
            sed -i "/defaultConfig {/a\        versionCode \( {VERSION_CODE}\n        versionName \" \){VERSION_NAME}\"" android/app/build.gradle
          fi

          echo "Android versionCode=\( {VERSION_CODE} versionName= \){VERSION_NAME}"
          grep -E "applicationId|versionCode|versionName" android/app/build.gradle

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          chmod +x gradlew &&
          ./gradlew assembleRelease
          -Pandroid.injected.signing.store.file="$(pwd)/app/upload-keystore.jks"
          -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD"
          -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS"
          -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Remove decoded keystore from the runner
        if: always()
        run: rm -f android/app/upload-keystore.jks

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anonroom-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Copy APK into repo for the download page
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/release/app-release.apk downloads/anonroom-latest.apk

      - name: Update /apk/download page and version.json
        run: |
          APK_URL="https://raw.githubusercontent.com/\( {{ github.repository }}/ \){{ github.ref_name }}/downloads/anonroom-latest.apk"
          APP_VERSION="\( {BUILD_VERSION:- \)(node -p "require('./package.json').version")}"

          if [ ! -f public/apk/download/index.html ]; then
            echo "ERROR: public/apk/download/index.html is missing from the repo."
            exit 1
          fi

          sed -i "s#%%APK_URL%%#${APK_URL}#g" public/apk/download/index.html
          sed -i -E 's#(class="download-btn" href=")[^"]*(")#\1'"${APK_URL}"'\2#g' public/apk/download/index.html

          printf '%s\n' "{\"version\": \"\( {APP_VERSION}\", \"apkUrl\": \" \){APK_URL}\"}" > public/apk/version.json
          echo "Wrote version ${APP_VERSION} -> ${APK_URL}"

      - name: Publish version to Supabase app_releases
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Skipping DB publish (SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not set)"
            exit 0
          fi
          APK_URL="https://raw.githubusercontent.com/\( {{ github.repository }}/ \){{ github.ref_name }}/downloads/anonroom-latest.apk"
          VER="${BUILD_VERSION}"
          BODY=$(printf '{"id":"android","version":"%s","apk_url":"%s","updated_at":"%s"}' "$VER" "\( APK_URL" " \)(date -u +%Y-%m-%dT%H:%M:%SZ)")
          curl -sS -f -X POST "${SUPABASE_URL}/rest/v1/app_releases?on_conflict=id" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "$BODY"
          echo "Upserted app_releases android -> $VER"

      - name: Commit and push the updated APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/anonroom-latest.apk public/apk/download/index.html public/apk/version.json
          if git diff --cached --quiet; then
            echo "APK unchanged since the last build — nothing to commit."
          else
            git commit -m "chore: update downloadable APK [skip ci]"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
            git stash drop 2>/dev/null || true
          fi
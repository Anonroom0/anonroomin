name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Build web app (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install Capacitor CLI + Android platform
        run: npm install @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0

      - name: Init Capacitor config
        run: npx cap init "Anonroom" "in.anonroom.app" --web-dir=dist

      - name: Add Android platform
        run: npx cap add android

      - name: Fix Kotlin stdlib version conflict
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
                  }
              }
          }
          EOF

      - name: Add location permissions
        run: |
          sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml

      - name: Set app icon and splash screen
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          npm install -g cordova-res
          mkdir -p resources
          cp public/android-chrome-512x512.png resources/icon.png
          convert -size 1920x1920 xc:"#0C0D10" \
            public/android-chrome-512x512.png -gravity center -composite \
            resources/splash.png
          cordova-res android --skip-config --copy

      - name: Copy web build into Android project
        run: npx cap copy android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anonroom-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build Android APK

on:
  workflow_dispatch: {}

# The commit-the-APK-back-into-the-repo step below needs push access —
# the default GITHUB_TOKEN is read-only unless this is declared.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (not the default shallow clone) so the later
          # `git pull --rebase` before pushing the APK commit doesn't choke
          # on a shallow repo if main has moved since this run started.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Resolve app version for this build
        # package.json base + GitHub run number so every CI APK is a new
        # version (e.g. 0.1.0.58). Without this, Check for update always
        # reports up-to-date because APK and version.json stay at 0.1.0.
        run: |
          BASE=$(node -p "require('./package.json').version")
          BUILD_VERSION="${BASE}.${{ github.run_number }}"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "Using BUILD_VERSION=${BUILD_VERSION}"

      - name: Build web app (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ env.BUILD_VERSION }}
          VITE_VERSION_JSON_URL: https://anonroom.in/apk/version.json

      - name: Install Capacitor CLI + Android platform
        run: npm install @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0

      - name: Init Capacitor config
        run: npx cap init "Anonroom" "in.anonroom.app" --web-dir=dist

      - name: Add Android platform
        run: npx cap add android

      - name: Fix Kotlin stdlib version conflict
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
                  }
              }
          }
          EOF

      - name: Add location permissions
        run: |
          sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml

      - name: Set app icon and splash screen
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          mkdir -p resources
          convert public/android-chrome-512x512.png -resize 1024x1024 resources/icon.png
          convert -size 2732x2732 xc:"#0C0D10" \
            public/android-chrome-512x512.png -gravity center -composite \
            resources/splash.png
          npx @capacitor/assets generate --android

      - name: Sync web build + native plugins into Android project
        # `cap sync` (not just `cap copy`) is required here: @capacitor/share
        # and @capacitor/filesystem (added for the native Share-to-Instagram
        # story flow — see src/lib/storyImageGenerator.js) are native
        # plugins that need to be linked into the Android project's
        # build.gradle/MainActivity, not just have their web JS copied in.
        # `cap copy` alone would leave them unlinked and the native Share
        # calls would fail at runtime even though the web bundle built fine.
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anonroom-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Copy APK into repo for the download page
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/anonroom-latest.apk

      - name: Update /apk/download page and version.json
        # Canonical path is public/apk/download (legacy public/download removed).
        # Expects public/apk/download/index.html committed with href="%%APK_URL%%".
        run: |
          APK_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/downloads/anonroom-latest.apk"
          APP_VERSION="${BUILD_VERSION:-$(node -p "require('./package.json').version")}"

          if [ ! -f public/apk/download/index.html ]; then
            echo "ERROR: public/apk/download/index.html is missing from the repo."
            echo "Commit that file with href=\"%%APK_URL%%\" and re-run."
            exit 1
          fi

          sed -i "s#%%APK_URL%%#${APK_URL}#g" public/apk/download/index.html
          sed -i -E 's#(class="download-btn" href=")[^"]*(")#\1'"${APK_URL}"'\2#g' public/apk/download/index.html

          printf '%s\n' "{\"version\": \"${APP_VERSION}\", \"apkUrl\": \"${APK_URL}\"}" > public/apk/version.json
          echo "Wrote version ${APP_VERSION} -> ${APK_URL}"

      - name: Publish version to Supabase app_releases
        # Requires repo secrets SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY.
        # Soft-skips if missing so local forks still build.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Skipping DB publish (SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not set)"
            exit 0
          fi
          APK_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/downloads/anonroom-latest.apk"
          VER="${BUILD_VERSION}"
          BODY=$(printf '{"id":"android","version":"%s","apk_url":"%s","updated_at":"%s"}' "$VER" "$APK_URL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
          curl -sS -f -X POST "${SUPABASE_URL}/rest/v1/app_releases?on_conflict=id" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "$BODY"
          echo "Upserted app_releases android -> $VER"

      - name: Commit and push the updated APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/anonroom-latest.apk public/apk/download/index.html public/apk/version.json
          if git diff --cached --quiet; then
            echo "APK unchanged since the last build — nothing to commit."
          else
            git commit -m "chore: update downloadable APK [skip ci]"
            # Build steps leave unstaged/untracked noise (android/, dist/, etc.).
            # --autostash lets pull --rebase proceed; drop the stash after push.
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
            git stash drop 2>/dev/null || true
          fi

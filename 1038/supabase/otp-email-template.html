<!--
  Paste this into: Supabase Dashboard → Authentication → Email Templates →
  "Confirm signup" → Message body (HTML).

  Keep the "Subject heading" field short, e.g.: "Your anonroom.in code"

  Email clients strip <style> blocks and backdrop-filter/blur, so every
  style below is inlined and uses solid colors only — no glassmorphism.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm your anonroom.in signup</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f2f2f7; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f2f7; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#ffffff; border-radius:16px; border:1px solid #e5e5ea; overflow:hidden;">

            <!-- Header -->
            <tr>
              <td style="background-color:#0a84ff; padding:24px 32px; text-align:center;">
                <span style="font-size:20px; font-weight:700; color:#ffffff; letter-spacing:-0.02em;">anonroom.in</span>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:32px 32px 24px 32px; text-align:center;">
                <p style="margin:0 0 8px 0; font-size:18px; font-weight:600; color:#1c1c1e;">
                  Confirm your account
                </p>
                <p style="margin:0 0 24px 0; font-size:14px; line-height:1.5; color:#6e6e73;">
                  Enter this code in anonroom.in to finish signing up. It expires shortly, so use it soon.
                </p>

                <!-- Code -->
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto 24px auto;">
                  <tr>
                    <td style="background-color:#f2f2f7; border:1px solid #e5e5ea; border-radius:12px; padding:20px 32px;">
                      <span style="font-size:36px; font-weight:700; letter-spacing:0.3em; color:#0a84ff; font-family:'Courier New', Courier, monospace;">
                        {{ .Token }}
                      </span>
                    </td>
                  </tr>
                </table>

                <p style="margin:0; font-size:13px; line-height:1.5; color:#9a9a9e;">
                  If you didn't request this, you can safely ignore this email.
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding:16px 32px 24px 32px; text-align:center; border-top:1px solid #e5e5ea;">
                <p style="margin:0; font-size:12px; color:#c7c7cc;">
                  anonroom.in
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
